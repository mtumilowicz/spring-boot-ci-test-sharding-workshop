name: Test shards

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shards:
    name: Test shard - ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: customer
            included_tag: customer
          - shard: order
            included_tag: order
          - shard: payment
            included_tag: payment
          - shard: remainder
            excluded_tags:
              - customer
              - order
              - payment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run ${{ matrix.shard }} tests
        if: matrix.included_tag
        env:
          INCLUDED_TAG: ${{ matrix.included_tag }}
        run: ./mvnw --batch-mode test "-Dgroups=$INCLUDED_TAG"

      - name: Run remainder tests
        if: matrix.excluded_tags
        env:
          EXCLUDED_TAGS: ${{ join(matrix.excluded_tags, ' | ') }}
        run: ./mvnw --batch-mode test "-DexcludedGroups=$EXCLUDED_TAGS"

      - name: Upload ${{ matrix.shard }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.shard }}
          path: target/surefire-reports/
          if-no-files-found: error

  aggregate:
    name: Aggregate test reports
    if: always()
    needs: shards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-reports-*
          path: combined-reports
          merge-multiple: true

      - name: Publish combined JUnit report
        uses: dorny/test-reporter@v2
        with:
          name: Combined JUnit report
          path: combined-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Preserve shard failure
        if: always() && needs.shards.result != 'success'
        run: |
          echo "At least one test shard failed."
          exit 1
